# Code Factory v2 Configuration Template
# Generated by /factory:init
# Stored as .factory/config.json (JSON serialization of this schema)

project:
  name: ""                    # Project name (from pyproject.toml or dir name)
  type: ""                    # web-app | api | cli | library | mobile | fullstack
  stack: []                   # [python, fastapi, react, postgres, ...]
  path: ""                    # Absolute path to project

storage:
  db_path: ".factory/factory.db"  # SQLite database path (v2: all state in SQLite)

autonomy: confirm_sprint      # full_auto | confirm_sprint | confirm_phase

quality:
  tdd: true
  coverage_min: 85
  coverage_core: 95
  lint: ""                    # e.g., "ruff check ."
  typecheck: ""               # e.g., "mypy src"
  format_check: ""            # e.g., "ruff format --check ."
  test: ""                    # e.g., "pytest -q"
  review_mode: enhanced       # minimal | enhanced | ultimate
  judge_threshold: 4.0
  judge_critical: 4.5

models:
  lead: opus                  # Orchestrator, architect, judge
  dev: sonnet                 # Developers
  tester: sonnet              # Testers
  judge: opus                 # Judge gate evaluator

budget:
  per_sprint: 5.0             # USD per sprint
  per_task: 1.0               # USD per task
  warn_percent: 70
  hard_stop_percent: 100

concurrency:
  max_agents: 5               # Maximum concurrent agents
  max_mutations_per_sprint: 5

pipeline:
  pm_analysis: true
  contract_negotiation: true
  implementation: true
  evaluation: true
  reflexion: true
  checkpoint: true

agent_defaults:
  developer:
    model: sonnet
    max_per_team: 3
  tester:
    model: sonnet
    max_per_team: 2
  architect:
    model: opus
    max_per_team: 1
  reviewer:
    model: opus
    max_per_team: 1
  judge:
    model: opus
    max_per_team: 1
  supervisor:
    model: sonnet
    max_per_team: 1
    check_interval: 3

circuit_breaker:
  enabled: true
  no_progress_threshold: 3
  same_error_threshold: 5
  cooldown_minutes: 30

heartbeat:
  check_interval: 10.0       # Seconds between heartbeat checks
  stale_threshold: 30.0       # Seconds before marking agent stale
  kill_threshold: 10          # Messages without response -> kill

rate_limiter:
  backoff_base: 5.0           # Seconds (exponential backoff)
  backoff_max: 300.0          # Max backoff seconds
  recovery_interval: 5        # Successes before +1 concurrency

skills:
  installed_plugins: []       # Detected at init: backend-development, python-development, etc.
  installed_skills: []        # Detected at init from find-skill catalogue
