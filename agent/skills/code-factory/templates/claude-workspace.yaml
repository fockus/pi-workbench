# .claude-workspace — workspace pointer for Code Factory + Memory Bank
# Generated by /factory:init
#
# Storage modes:
#   local    — .factory/ and .memory-bank/ in project root (default)
#   external — data in ~/.claude/workspaces/{project_id}/
#
# This file can be committed (contains only project_id, not data)
# Or add to .gitignore (each developer configures their own)

project_id: "{{PROJECT_ID}}"
storage: "{{STORAGE_MODE}}"
